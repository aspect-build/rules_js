lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      sass-embedded:
        specifier: 1.97.3
        version: 1.97.3

# Trimmed from ../../v101/pnpm-lock.yaml to the sass-embedded platform packages.
# pnpm copies package.json os/cpu/libc fields verbatim, so a package declaring a single
# value produces a scalar instead of a list. The sass-embedded-linux-* packages do this
# for libc; the darwin-arm64 entry is edited to do the same for os and cpu.
packages:

  sass-embedded-darwin-arm64@1.97.3:
    resolution: {integrity: sha512-fuqMTqO4gbOmA/kC5b9y9xxNYw6zDEyfOtMgabS7Mz93wimSk2M1quQaTJnL98Mkcsl2j+7shNHxIS/qpcIDDA==}
    engines: {node: '>=14.0.0'}
    cpu: arm64
    os: darwin

  sass-embedded-darwin-x64@1.97.3:
    resolution: {integrity: sha512-b/2RBs/2bZpP8lMkyZ0Px0vkVkT8uBd0YXpOwK7iOwYkAT8SsO4+WdVwErsqC65vI5e1e5p1bb20tuwsoQBMVA==}
    engines: {node: '>=14.0.0'}
    cpu: [x64]
    os: [darwin]

  sass-embedded-linux-musl-x64@1.97.3:
    resolution: {integrity: sha512-/oWJ+OVrDg7ADDQxRLC/4g1+Nsz1g4mkYS2t6XmyMJKFTFK50FVI2t5sOdFH+zmMp+nXHKM036W94y9m4jjEcw==}
